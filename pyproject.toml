[project]
name = 'fraudguard'
version = '0.1.0'
description = 'Credit card fraud detection with reproducible training, MLflow tracking, and a FastAPI inference service.'
readme = 'README.md'
requires-python = '>=3.12'
license = 'MIT'
license-files = ['LICENSE']
authors = [{ name = 'Sami Asghar' }]
dependencies = [
    'fastapi',
    'imbalanced-learn',
    'joblib',
    'matplotlib',
    'mlflow',
    'numpy',
    'pandas',
    'pyarrow',
    'pydantic',
    'pydantic-settings',
    'pyyaml',
    'scikit-learn',
    'scipy',
    'shap',
    'skops',
    'uvicorn',
    'xgboost',
]

[dependency-groups]
dev = [
    'httpx2',
    'mypy',
    'pandas-stubs',
    'pre-commit',
    'pytest',
    'pytest-cov',
    'ruff',
    'types-pyyaml',
]
notebook = [
    'ipykernel',
    'jupyterlab',
    'nbconvert',
]

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['src/fraudguard']

[tool.uv]
# Older uv releases do not understand exclude-dependencies
required-version = '>=0.13'
# Resolve against a fixed date so that relocking gives the same versions
exclude-newer = '2026-10-01T00:00:00Z'
# XGBoost pulls in NCCL (over 300 MB) on Linux; it is only used for multi-GPU training
exclude-dependencies = ['nvidia-nccl-cu12', 'nvidia-nccl-cu13']

[tool.ruff]
line-length = 100
target-version = 'py312'
extend-include = ['*.ipynb']

[tool.ruff.format]
# Keep single-quoted docstrings; the formatter would otherwise switch them to double quotes
quote-style = 'preserve'

[tool.ruff.lint]
select = [
    'B',    # bugbear
    'C4',   # comprehensions
    'D',    # docstrings
    'E',    # pycodestyle errors
    'F',    # pyflakes
    'I',    # import order
    'N',    # naming
    'PTH',  # pathlib
    'Q',    # quotes
    'RUF',  # ruff-specific
    'SIM',  # simplify
    'UP',   # pyupgrade
    'W',    # pycodestyle warnings
]
ignore = [
    'D105',  # magic methods are self-explanatory
    'D107',  # classes document their constructor arguments
    'D300',  # docstrings use single quotes like the rest of the code
]

[tool.ruff.lint.per-file-ignores]
'tests/*' = ['D']
'notebooks/*' = ['D', 'E402']

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'
multiline-quotes = 'single'
docstring-quotes = 'single'

[tool.ruff.lint.pydocstyle]
convention = 'google'

[tool.mypy]
python_version = '3.12'
strict = true
plugins = ['pydantic.mypy']
files = ['src', 'scripts', 'tests']
mypy_path = 'src'

[[tool.mypy.overrides]]
# These libraries ship without type information
module = ['imblearn.*', 'joblib.*', 'shap.*', 'skops.*', 'sklearn.*', 'scipy.*']
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ['tests']
addopts = ['--strict-markers', '--strict-config']
filterwarnings = [
    'error::pytest.PytestUnraisableExceptionWarning',
    # Deprecations inside third-party packages that this project cannot act on
    'ignore::PendingDeprecationWarning:shap',
    'ignore:The ``noload`` loader strategy is deprecated',
]

[tool.coverage.run]
source = ['fraudguard']
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
