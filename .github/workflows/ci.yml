name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type check, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          version: '0.13.8'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

      - name: Train a small model on synthetic data
        run: |
          uv run python scripts/generate_sample_data.py --n_rows 20000
          uv run python scripts/train_model.py --use_sample_data

  docker:
    name: Build and smoke test the image
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: fraudguard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate the compose file
        run: docker compose config --quiet

      - name: Train and serve inside the container
        run: |
          docker run --detach --name fraudguard --publish 8000:8000 fraudguard:ci \
            sh -c 'python scripts/generate_sample_data.py --n_rows 20000 \
              && python scripts/train_model.py --use_sample_data \
              && python scripts/run_api.py'
          curl --fail --silent --show-error --retry 60 --retry-delay 5 --retry-all-errors \
            http://localhost:8000/health

      - name: Score a transaction
        run: |
          curl --fail --silent --show-error http://localhost:8000/predict \
            --header 'Content-Type: application/json' \
            --data '{"time_seconds": 0, "v1": -1.36, "v2": -0.07, "v3": 2.54, "v4": 1.38,
              "v5": -0.34, "v6": 0.46, "v7": 0.24, "v8": 0.1, "v9": 0.36, "v10": 0.09,
              "v11": -0.55, "v12": -0.62, "v13": -0.99, "v14": -0.31, "v15": 1.47,
              "v16": -0.47, "v17": 0.21, "v18": 0.03, "v19": 0.4, "v20": 0.25,
              "v21": -0.02, "v22": 0.28, "v23": -0.11, "v24": 0.07, "v25": 0.13,
              "v26": -0.19, "v27": 0.13, "v28": -0.02, "amount": 149.62}'

      - name: Show container logs
        if: always()
        run: docker logs fraudguard
