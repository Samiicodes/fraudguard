# Pipeline configuration. Paths are relative to the repository root.

data:
  raw_path: data/raw/creditcard.csv
  sample_path: data/raw/sample_transactions.csv
  processed_dir: data/processed

validation:
  max_missing_fraction: 0.05
  max_invalid_fraction: 0.01
  min_fraud_rows: 30
  # A fraud rate outside this range usually means wrong labels or a pre-balanced file
  min_fraud_rate: 0.0005
  max_fraud_rate: 0.2

split:
  validation_size: 0.2
  test_size: 0.2
  random_seed: 42

features:
  # Bucket boundaries in the transaction currency. An amount equal to an edge
  # falls into the bucket above it, so these give seven buckets numbered 0 to 6.
  amount_bucket_edges: [1, 10, 50, 100, 500, 1000]

training:
  random_seed: 42
  # Candidates are ranked on the validation split by this metric
  selection_metric: pr_auc
  # Minority-to-majority ratio after SMOTE, applied to training data only
  smote_sampling_ratio: 0.1
  candidates:
    - name: logistic_regression
      algorithm: logistic_regression
      imbalance_strategy: class_weight
      params:
        C: 0.1
        max_iter: 2000
    - name: random_forest
      algorithm: random_forest
      imbalance_strategy: class_weight
      params:
        n_estimators: 300
        max_depth: 12
        min_samples_leaf: 2
    - name: xgboost
      algorithm: xgboost
      imbalance_strategy: scale_pos_weight
      params:
        n_estimators: 400
        learning_rate: 0.05
        max_depth: 5
        subsample: 0.8
        colsample_bytree: 0.8
    # Control: same model without imbalance handling, to show what the weighting changes
    - name: xgboost_unweighted
      algorithm: xgboost
      imbalance_strategy: none
      params:
        n_estimators: 400
        learning_rate: 0.05
        max_depth: 5
        subsample: 0.8
        colsample_bytree: 0.8
    - name: xgboost_smote
      algorithm: xgboost
      imbalance_strategy: smote
      params:
        n_estimators: 400
        learning_rate: 0.05
        max_depth: 5
        subsample: 0.8
        colsample_bytree: 0.8

threshold:
  # Review effort and customer friction for one blocked legitimate transaction
  false_positive_cost: 5.0
  # Average fraud loss plus chargeback handling for one missed fraud
  false_negative_cost: 150.0
  # Review capacity: at most one false alert per 1,000 legitimate transactions
  max_false_positive_rate: 0.001

evaluation:
  bootstrap_samples: 500
  calibration_bins: 10

explainability:
  sample_size: 2000
  top_features: 10
  permutation_repeats: 5

mlflow:
  tracking_uri: sqlite:///mlflow.db
  artifact_dir: mlartifacts
  experiment_name: fraudguard
  registered_model_name: fraudguard
  champion_alias: champion

reports:
  output_dir: reports

api:
  host: 127.0.0.1
  port: 8000
  explanation_top_k: 5

monitoring:
  prediction_log_path: data/monitoring/predictions.jsonl
  window_size: 5000
  min_drift_samples: 200
  psi_bins: 10
  psi_warning_threshold: 0.1
  psi_alert_threshold: 0.25
